<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A cozy knitted sweater in warm red">
  <defs>
    <linearGradient id="skybg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <linearGradient id="sweaterBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <pattern id="knit" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 5 Q2.5 2.5 5 5 T10 5" stroke="#7f1d1d" stroke-width="0.6" fill="none" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="220" height="220" fill="url(#skybg)"/>
  <!-- Soft floor shadow -->
  <ellipse cx="110" cy="205" rx="80" ry="6" fill="#000" opacity="0.08"/>
  <!-- Body -->
  <path d="M 60 65 L 70 55 L 90 55 L 110 70 L 130 55 L 150 55 L 160 65 L 165 180 L 55 180 Z"
    fill="url(#sweaterBody)" stroke="#7f1d1d" stroke-width="3" stroke-linejoin="round"/>
  <!-- Knit texture overlay -->
  <path d="M 60 65 L 70 55 L 90 55 L 110 70 L 130 55 L 150 55 L 160 65 L 165 180 L 55 180 Z"
    fill="url(#knit)"/>
  <!-- Left arm -->
  <path d="M 40 70 L 65 60 L 78 130 L 55 138 Z" fill="url(#sweaterBody)" stroke="#7f1d1d" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right arm -->
  <path d="M 180 70 L 155 60 L 142 130 L 165 138 Z" fill="url(#sweaterBody)" stroke="#7f1d1d" stroke-width="3" stroke-linejoin="round"/>
  <!-- Neck collar (turtleneck ribbing) -->
  <path d="M 90 55 Q 110 42 130 55 L 130 65 Q 110 55 90 65 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2.5"/>
  <line x1="93" y1="48" x2="93" y2="66" stroke="#7f1d1d" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="46" x2="100" y2="64" stroke="#7f1d1d" stroke-width="1" opacity="0.5"/>
  <line x1="110" y1="45" x2="110" y2="65" stroke="#7f1d1d" stroke-width="1" opacity="0.5"/>
  <line x1="120" y1="46" x2="120" y2="64" stroke="#7f1d1d" stroke-width="1" opacity="0.5"/>
  <line x1="127" y1="48" x2="127" y2="66" stroke="#7f1d1d" stroke-width="1" opacity="0.5"/>
  <!-- Sleeve cuff ribbing (left) -->
  <path d="M 40 70 L 65 60 L 66 68 L 42 78 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
  <path d="M 55 138 L 78 130 L 80 140 L 57 148 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
  <!-- Sleeve cuff ribbing (right) -->
  <path d="M 180 70 L 155 60 L 154 68 L 178 78 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
  <path d="M 165 138 L 142 130 L 140 140 L 163 148 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
  <!-- Waist ribbing -->
  <rect x="55" y="170" width="110" height="12" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
  <line x1="70" y1="170" x2="70" y2="182" stroke="#7f1d1d" stroke-width="1" opacity="0.5"/>
  <line x1="85" y1="170" x2="85" y2="182" stroke="#7f1d1d" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="170" x2="100" y2="182" stroke="#7f1d1d" stroke-width="1" opacity="0.5"/>
  <line x1="115" y1="170" x2="115" y2="182" stroke="#7f1d1d" stroke-width="1" opacity="0.5"/>
  <line x1="130" y1="170" x2="130" y2="182" stroke="#7f1d1d" stroke-width="1" opacity="0.5"/>
  <line x1="145" y1="170" x2="145" y2="182" stroke="#7f1d1d" stroke-width="1" opacity="0.5"/>
  <!-- Little snowflake decorations -->
  <g fill="#fef9c3" stroke="#7f1d1d" stroke-width="1">
    <path d="M 88 105 L 92 105 M 90 103 L 90 107 M 88.5 103.5 L 91.5 106.5 M 91.5 103.5 L 88.5 106.5"/>
  </g>
  <g fill="#fef9c3" stroke="#7f1d1d" stroke-width="1">
    <path d="M 128 105 L 132 105 M 130 103 L 130 107 M 128.5 103.5 L 131.5 106.5 M 131.5 103.5 L 128.5 106.5"/>
  </g>
  <g fill="#fef9c3" stroke="#7f1d1d" stroke-width="1">
    <path d="M 108 130 L 112 130 M 110 128 L 110 132 M 108.5 128.5 L 111.5 131.5 M 111.5 128.5 L 108.5 131.5"/>
  </g>
</svg>
