<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grandfather fishing by a river at sunset">
  <defs>
    <linearGradient id="skyF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="60%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="riverF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="220" height="220" fill="url(#skyF)"/>
  <!-- Distant mountains -->
  <path d="M 0 130 L 40 100 L 75 115 L 110 90 L 150 110 L 190 100 L 220 125 L 220 145 L 0 145 Z"
    fill="#a7c4a0" opacity="0.7" stroke="#4d7c0f" stroke-width="1"/>
  <!-- Sun -->
  <circle cx="175" cy="55" r="18" fill="#fbbf24" opacity="0.85"/>
  <circle cx="175" cy="55" r="14" fill="#fef3c7"/>
  <!-- River bank grass line -->
  <path d="M 0 145 L 220 145 L 220 155 L 0 155 Z" fill="#65a30d"/>
  <!-- River -->
  <rect x="0" y="155" width="220" height="65" fill="url(#riverF)"/>
  <!-- Water ripples -->
  <path d="M 20 170 Q 30 168 40 170" stroke="#dbeafe" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 80 185 Q 90 183 100 185" stroke="#dbeafe" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 140 175 Q 150 173 160 175" stroke="#dbeafe" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 50 200 Q 60 198 70 200" stroke="#dbeafe" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 160 205 Q 170 203 180 205" stroke="#dbeafe" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Grandfather (silhouette-ish, sitting on grass) -->
  <!-- Hat -->
  <ellipse cx="70" cy="98" rx="22" ry="4" fill="#78350f"/>
  <path d="M 55 95 Q 55 80 70 78 Q 85 80 85 95 Z" fill="#a16207" stroke="#451a03" stroke-width="1.5"/>
  <ellipse cx="70" cy="95" rx="18" ry="3" fill="#78350f"/>
  <!-- Head -->
  <circle cx="70" cy="104" r="10" fill="#fed7aa" stroke="#78350f" stroke-width="1.5"/>
  <!-- Beard (white — grandfather) -->
  <path d="M 62 108 Q 70 118 78 108 Q 76 115 70 116 Q 64 115 62 108 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <!-- Eyes -->
  <circle cx="66" cy="103" r="1.4" fill="#1f2937"/>
  <circle cx="74" cy="103" r="1.4" fill="#1f2937"/>
  <!-- Smile -->
  <path d="M 66 108 Q 70 111 74 108" stroke="#78350f" stroke-width="1" fill="none"/>
  <!-- Body (sitting) -->
  <path d="M 55 118 Q 70 115 85 118 L 90 148 L 50 148 Z" fill="#65a30d" stroke="#365314" stroke-width="1.8"/>
  <!-- Arm holding rod -->
  <path d="M 82 122 Q 100 118 118 130" stroke="#fed7aa" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Fishing rod -->
  <line x1="118" y1="130" x2="200" y2="40" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Rod tip highlight -->
  <line x1="118" y1="130" x2="200" y2="40" stroke="#fbbf24" stroke-width="0.6"/>
  <!-- Fishing line -->
  <line x1="200" y1="40" x2="180" y2="175" stroke="#f8fafc" stroke-width="0.8" opacity="0.85"/>
  <!-- Float on water -->
  <circle cx="180" cy="175" r="4" fill="#dc2626" stroke="#7f1d1d" stroke-width="1"/>
  <circle cx="180" cy="175" r="1.5" fill="#fff"/>
  <!-- Splash ring -->
  <ellipse cx="180" cy="178" rx="10" ry="2" fill="none" stroke="#dbeafe" stroke-width="1"/>
  <!-- Bucket next to him -->
  <path d="M 32 138 L 30 155 L 46 155 L 44 138 Z" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="38" cy="138" rx="7" ry="2" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <!-- A fish jumping (in bucket) -->
  <path d="M 34 145 Q 38 142 42 145 L 40 148 L 36 148 Z" fill="#f97316" stroke="#7c2d12" stroke-width="0.8"/>
</svg>
