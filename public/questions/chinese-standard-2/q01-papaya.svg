<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A papaya tree with ripe papayas hanging near the top">
  <defs>
    <linearGradient id="skyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="fruit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="220" height="220" fill="url(#skyBg)"/>
  <!-- Ground -->
  <ellipse cx="110" cy="205" rx="100" ry="10" fill="#84cc16" opacity="0.45"/>
  <!-- Trunk -->
  <path d="M 100 200 Q 108 100 105 60 Q 108 55 115 60 Q 118 100 120 200 Z"
    fill="url(#trunk)" stroke="#451a03" stroke-width="1.5"/>
  <!-- Trunk texture rings -->
  <path d="M 100 190 Q 110 194 120 190" stroke="#451a03" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 101 160 Q 110 164 119 160" stroke="#451a03" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 102 130 Q 110 134 118 130" stroke="#451a03" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 103 100 Q 110 104 117 100" stroke="#451a03" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Papaya fruits clustered near top -->
  <ellipse cx="88" cy="70" rx="12" ry="16" fill="url(#fruit)" stroke="#7c2d12" stroke-width="1.5"/>
  <ellipse cx="105" cy="62" rx="13" ry="17" fill="url(#fruit)" stroke="#7c2d12" stroke-width="1.5"/>
  <ellipse cx="123" cy="70" rx="12" ry="16" fill="url(#fruit)" stroke="#7c2d12" stroke-width="1.5"/>
  <ellipse cx="140" cy="80" rx="10" ry="14" fill="url(#fruit)" stroke="#7c2d12" stroke-width="1.5"/>
  <!-- Fruit highlights -->
  <ellipse cx="85" cy="65" rx="3" ry="5" fill="#fef3c7" opacity="0.7"/>
  <ellipse cx="102" cy="56" rx="3" ry="5" fill="#fef3c7" opacity="0.7"/>
  <ellipse cx="120" cy="65" rx="3" ry="5" fill="#fef3c7" opacity="0.7"/>
  <!-- Palm leaves (fan out from top) -->
  <g fill="#16a34a" stroke="#14532d" stroke-width="1.5">
    <path d="M 110 55 Q 60 40 30 20 Q 45 45 60 50 Q 80 55 110 55 Z"/>
    <path d="M 110 55 Q 160 40 190 20 Q 175 45 160 50 Q 140 55 110 55 Z"/>
    <path d="M 110 55 Q 60 55 20 60 Q 45 65 65 65 Q 85 63 110 55 Z"/>
    <path d="M 110 55 Q 160 55 200 60 Q 175 65 155 65 Q 135 63 110 55 Z"/>
    <path d="M 110 55 Q 100 20 90 5 Q 100 30 105 40 Q 108 50 110 55 Z"/>
    <path d="M 110 55 Q 120 20 130 5 Q 120 30 115 40 Q 112 50 110 55 Z"/>
  </g>
  <!-- Leaf veins -->
  <g stroke="#14532d" stroke-width="0.8" fill="none" opacity="0.6">
    <path d="M 110 55 L 30 20"/>
    <path d="M 110 55 L 190 20"/>
    <path d="M 110 55 L 20 60"/>
    <path d="M 110 55 L 200 60"/>
  </g>
</svg>
