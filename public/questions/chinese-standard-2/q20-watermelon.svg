<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A slice of watermelon with juicy red flesh and black seeds">
  <defs>
    <linearGradient id="bgW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <linearGradient id="fleshW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="rindW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="220" height="220" fill="url(#bgW)"/>
  <!-- Floor shadow -->
  <ellipse cx="110" cy="200" rx="80" ry="5" fill="#000" opacity="0.1"/>
  <!-- Rind outer -->
  <path d="M 20 130 A 90 90 0 0 1 200 130 L 200 145 L 20 145 Z" fill="url(#rindW)" stroke="#166534" stroke-width="2.5"/>
  <!-- White pith (between rind and flesh) -->
  <path d="M 26 130 A 84 84 0 0 1 194 130 L 194 138 L 26 138 Z" fill="#f0fdf4" stroke="#a3e635" stroke-width="1.2"/>
  <!-- Red flesh (semi-circle) -->
  <path d="M 32 130 A 78 78 0 0 1 188 130 Z" fill="url(#fleshW)" stroke="#7f1d1d" stroke-width="1.5"/>
  <!-- Flesh shine -->
  <path d="M 50 80 Q 110 55 170 80" stroke="#fecaca" stroke-width="4" fill="none" opacity="0.55" stroke-linecap="round"/>
  <!-- Seeds scattered on flesh -->
  <g fill="#1f2937" stroke="#000" stroke-width="0.5">
    <ellipse cx="70"  cy="105" rx="3" ry="5" transform="rotate(-15 70 105)"/>
    <ellipse cx="95"  cy="90"  rx="3" ry="5" transform="rotate(10 95 90)"/>
    <ellipse cx="120" cy="82"  rx="3" ry="5" transform="rotate(-5 120 82)"/>
    <ellipse cx="145" cy="90"  rx="3" ry="5" transform="rotate(20 145 90)"/>
    <ellipse cx="80"  cy="120" rx="3" ry="5" transform="rotate(5 80 120)"/>
    <ellipse cx="110" cy="115" rx="3" ry="5" transform="rotate(-10 110 115)"/>
    <ellipse cx="140" cy="118" rx="3" ry="5" transform="rotate(15 140 118)"/>
    <ellipse cx="60"  cy="122" rx="3" ry="5" transform="rotate(-20 60 122)"/>
    <ellipse cx="160" cy="115" rx="3" ry="5" transform="rotate(25 160 115)"/>
  </g>
  <!-- Juice drops -->
  <g fill="#f87171" opacity="0.7">
    <path d="M 55 155 Q 55 165 58 168 Q 61 165 61 155 Z"/>
    <path d="M 165 155 Q 165 165 168 168 Q 171 165 171 155 Z"/>
    <path d="M 110 158 Q 110 170 113 173 Q 116 170 116 158 Z"/>
  </g>
  <!-- Sparkle sun-highlight -->
  <g fill="#fef3c7" opacity="0.9">
    <path d="M 82 75 L 84 82 L 91 84 L 84 86 L 82 93 L 80 86 L 73 84 L 80 82 Z"/>
  </g>
</svg>
