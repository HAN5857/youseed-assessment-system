<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A warm winter coat with buttons and a fluffy hood">
  <defs>
    <linearGradient id="coatbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="coatBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="220" height="220" fill="url(#coatbg)"/>
  <!-- Falling snowflakes -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="30" cy="30" r="2.5"/>
    <circle cx="180" cy="45" r="2"/>
    <circle cx="200" cy="90" r="2.5"/>
    <circle cx="15" cy="120" r="2"/>
    <circle cx="25" cy="180" r="2.5"/>
    <circle cx="195" cy="170" r="2"/>
  </g>
  <!-- Soft floor shadow -->
  <ellipse cx="110" cy="205" rx="80" ry="6" fill="#000" opacity="0.08"/>
  <!-- Coat body (long parka) -->
  <path d="M 55 75 L 68 63 L 90 63 L 110 78 L 130 63 L 152 63 L 165 75 L 168 195 L 52 195 Z"
    fill="url(#coatBody)" stroke="#1e3a8a" stroke-width="3" stroke-linejoin="round"/>
  <!-- Left arm -->
  <path d="M 35 82 L 62 68 L 78 155 L 52 165 Z" fill="url(#coatBody)" stroke="#1e3a8a" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right arm -->
  <path d="M 185 82 L 158 68 L 142 155 L 168 165 Z" fill="url(#coatBody)" stroke="#1e3a8a" stroke-width="3" stroke-linejoin="round"/>
  <!-- Fluffy hood/collar -->
  <ellipse cx="110" cy="63" rx="34" ry="16" fill="#f5f5f4" stroke="#1e3a8a" stroke-width="2.5"/>
  <circle cx="88" cy="60" r="7" fill="#fafaf9"/>
  <circle cx="96" cy="55" r="8" fill="#f5f5f4"/>
  <circle cx="105" cy="52" r="9" fill="#fafaf9"/>
  <circle cx="115" cy="52" r="9" fill="#f5f5f4"/>
  <circle cx="124" cy="55" r="8" fill="#fafaf9"/>
  <circle cx="132" cy="60" r="7" fill="#f5f5f4"/>
  <!-- Center zipper line -->
  <line x1="110" y1="80" x2="110" y2="195" stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="4 2"/>
  <!-- Buttons -->
  <circle cx="110" cy="100" r="5.5" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
  <circle cx="110" cy="100" r="1.5" fill="#78350f"/>
  <circle cx="110" cy="130" r="5.5" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
  <circle cx="110" cy="130" r="1.5" fill="#78350f"/>
  <circle cx="110" cy="160" r="5.5" fill="#fbbf24" stroke="#78350f" stroke-width="1.5"/>
  <circle cx="110" cy="160" r="1.5" fill="#78350f"/>
  <!-- Fluffy sleeve cuffs -->
  <ellipse cx="52" cy="163" rx="15" ry="6" fill="#f5f5f4" stroke="#1e3a8a" stroke-width="2"/>
  <ellipse cx="168" cy="163" rx="15" ry="6" fill="#f5f5f4" stroke="#1e3a8a" stroke-width="2"/>
  <!-- Pockets -->
  <rect x="72" y="145" width="24" height="20" rx="3" fill="none" stroke="#1e3a8a" stroke-width="2.5"/>
  <rect x="124" y="145" width="24" height="20" rx="3" fill="none" stroke="#1e3a8a" stroke-width="2.5"/>
  <line x1="72" y1="152" x2="96" y2="152" stroke="#1e3a8a" stroke-width="2"/>
  <line x1="124" y1="152" x2="148" y2="152" stroke="#1e3a8a" stroke-width="2"/>
  <!-- Bottom fluffy trim -->
  <ellipse cx="110" cy="195" rx="60" ry="5" fill="#f5f5f4" opacity="0.4"/>
</svg>
